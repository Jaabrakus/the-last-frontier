<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="36" y2="36">
      <stop offset="0" stop-color="#fbe6ae"/><stop offset="0.5" stop-color="#d7b26a"/><stop offset="1" stop-color="#8a6630"/>
    </linearGradient>
    <linearGradient id="arm" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="90" y2="0">
      <stop offset="0" stop-color="#e9c983"/><stop offset="1" stop-color="#9c7a40"/>
    </linearGradient>
    <linearGradient id="armv" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="90">
      <stop offset="0" stop-color="#e9c983"/><stop offset="1" stop-color="#9c7a40"/>
    </linearGradient>
  </defs>
  <!-- arms along the two edges, a dark under-stroke first -->
  <g fill="none" stroke="#07080b" stroke-width="5.5" stroke-linecap="round">
    <path d="M30 4.5 L80 4.5"/><path d="M4.5 30 L4.5 80"/>
    <path d="M32 10 L60 10"/><path d="M10 32 L10 60"/>
  </g>
  <path d="M30 4.5 L80 4.5" stroke="url(#arm)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M4.5 30 L4.5 80" stroke="url(#armv)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M32 10 L60 10" stroke="#c9a35e" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M10 32 L10 60" stroke="#c9a35e" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- diamond terminals -->
  <path d="M79 4.5 L84 0.8 L89 4.5 L84 8.2 Z" fill="#d7b26a" stroke="#07080b" stroke-width="1.2"/>
  <path d="M4.5 79 L8.2 84 L4.5 89 L0.8 84 Z" fill="#d7b26a" stroke="#07080b" stroke-width="1.2"/>
  <circle cx="61" cy="10" r="1.8" fill="#d7b26a"/><circle cx="10" cy="61" r="1.8" fill="#d7b26a"/>
  <!-- the knot: a square and a square on its points, interlaced, round a gold boss -->
  <g stroke="#07080b" stroke-width="5" stroke-linejoin="round" fill="#141820">
    <path d="M7 7 L29 7 L29 29 L7 29 Z"/>
    <path d="M18 2.4 L33.6 18 L18 33.6 L2.4 18 Z"/>
  </g>
  <g stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M7 7 L29 7 L29 29 L7 29 Z"/>
    <path d="M18 2.4 L33.6 18 L18 33.6 L2.4 18 Z"/>
  </g>
  <!-- the over-under: the square's sides cross over the diamond's at the top and left, under at the right and bottom -->
  <g stroke="#141820" stroke-width="3.2" stroke-linecap="butt">
    <path d="M10.5 7 L13.5 7"/><path d="M7 10.5 L7 13.5"/>
    <path d="M22.5 29 L25.5 29"/><path d="M29 22.5 L29 25.5"/>
  </g>
  <g stroke="url(#g)" stroke-width="2.2" stroke-linecap="butt">
    <path d="M10 7 L14 7"/><path d="M7 10 L7 14"/>
  </g>
  <path d="M22.4 31.5 L25.6 27.7" stroke="url(#g)" stroke-width="2.2"/>
  <path d="M31.5 22.4 L27.7 25.6" stroke="url(#g)" stroke-width="2.2"/>
  <circle cx="18" cy="18" r="6.2" fill="#07080b"/>
  <circle cx="18" cy="18" r="4.6" fill="url(#g)"/>
  <circle cx="16.6" cy="16.4" r="1.4" fill="#fff6d8" fill-opacity="0.8"/>
</svg>
