<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- Tidebreak's web page (tools/web/shell.html, the Web Public preset's custom shell). The game's pack comes in parts
		     (tools/web/split_pck.py: Reddit takes files up to 100 MB, each upload within 30 s): index.pck.parts.json lists
		     them; they are fetched, joined in memory and handed to the engine as index.pck. Without the list (a build not
		     split yet) the pack loads whole, as Godot's own page does. -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e8eef2;
	background-color: #0b1418;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#canvas.free-look {
	cursor: none !important;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	background: #0b1418 center / cover no-repeat;
	padding-bottom: 9vh;
	gap: 0.75rem;
}

#status-bar {
	width: min(28rem, 80vw);
	height: 0.4rem;
	border-radius: 0.2rem;
	background: rgba(255, 255, 255, 0.16);
	overflow: hidden;
}

#status-fill {
	height: 100%;
	width: 0%;
	background: #7fd3e6;
	transition: width 0.2s linear;
}

#status-text {
	font-size: 0.9rem;
	letter-spacing: 0.04em;
	text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
	font-variant-numeric: tabular-nums;
}

#rotate {
	display: none;
	position: absolute;
	inset: 0;
	z-index: 2;
	background: #0b1418;
	color: #e8eef2;
	align-items: center;
	justify-content: center;
	text-align: center;
	font-size: 1.2rem;
	padding: 0 2rem;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate {
		display: flex;
	}
}

#status-notice {
	display: none;
	max-width: min(32rem, 86vw);
	background-color: #4a2a33;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	padding: 1rem;
	line-height: 1.35;
	text-align: center;
	white-space: pre-line;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="rotate">Turn your phone sideways to play</div>

		<div id="status">
			<div id="status-notice"></div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-text">Loading</div>
		</div>

		<script>
/* The canvas resolution (the owner, 2026-10-16: the browser game "does not feel smooth at all versus the local build"): the engine
   sizes its canvas by window.devicePixelRatio, which on a Retina screen is 2, four times the pixels of the desktop game's own
   window drawn through a single-threaded WebGL renderer. The ratio the engine sees is capped here at DPR_CAP (1.25: a sharp enough
   picture for a quarter fewer than half the pixels); ?dpr=1 asks for the fastest, ?dpr=2 for the sharpest. Mouse positions are
   in CSS pixels and unaffected. */
(function () {
	const real = window.devicePixelRatio || 1;
	const ask = parseFloat(new URLSearchParams(location.search).get('dpr'));
	const cap = ask > 0 ? ask : 1.25;
	const ratio = Math.max(1, Math.min(real, cap));
	try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return ratio; }, configurable: true }); } catch (e) { /* kept as is */ }
	window.tidebreakDpr = { real: real, used: ratio };
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const notice = document.getElementById('status-notice');
	status.style.backgroundImage = 'url("$GODOT_SPLASH")';

	const exe = GODOT_CONFIG['executable'];
	const pack = GODOT_CONFIG['mainPack'] || (exe + '.pck');
	// Bytes so far / in all, of the engine (wasm) and the pack.
	const got = { wasm: 0, pack: 0 };
	const total = { wasm: (GODOT_CONFIG['fileSizes'] || {})[exe + '.wasm'] || 0, pack: 0 };

	function show() {
		const all = total.wasm + total.pack;
		const now = got.wasm + got.pack;
		if (all > 0) {
			fill.style.width = Math.min(100, (100 * now) / all).toFixed(1) + '%';
			text.textContent = 'Loading  ' + (now / 1048576).toFixed(0) + ' / ' + (all / 1048576).toFixed(0) + ' MB';
		}
	}

	function fail(err) {
		console.error(err);
		notice.textContent = (err instanceof Error) ? err.message : String(err || 'Something went wrong while loading.');
		notice.style.display = 'block';
		text.textContent = '';
	}

	// One part, with its bytes counted as they come; tried again (3 times in all) when the network drops it.
	async function fetchPart(url, size, tries) {
		let seen = 0;
		try {
			const res = await fetch(url);
			if (!res.ok) {
				throw new Error(url + ': ' + res.status);
			}
			const reader = res.body.getReader();
			const chunks = [];
			for (;;) {
				const { done, value } = await reader.read();
				if (done) {
					break;
				}
				chunks.push(value);
				seen += value.length;
				got.pack += value.length;
				show();
			}
			if (seen !== size) {
				throw new Error(url + ': ' + seen + ' bytes of ' + size);
			}
			return chunks;
		} catch (err) {
			got.pack -= seen;
			if (tries > 1) {
				return fetchPart(url, size, tries - 1);
			}
			throw err;
		}
	}

	// The pack from its parts (three at a time), joined in one buffer: null when the build has no parts list.
	async function loadParts() {
		let list;
		try {
			const res = await fetch(pack + '.parts.json', { cache: 'no-cache' });
			if (!res.ok) {
				return null;
			}
			list = await res.json();
		} catch (err) {
			return null;
		}
		total.pack = list.size;
		show();
		const out = new Uint8Array(list.size);
		let next = 0;
		async function worker() {
			while (next < list.parts.length) {
				const i = next++;
				const p = list.parts[i];
				const chunks = await fetchPart(p.file + (list.build ? '?v=' + list.build : ''), p.size, 3);
				let at = p.offset;
				for (const c of chunks) {
					out.set(c, at);
					at += c.length;
				}
			}
		}
		await Promise.all([worker(), worker(), worker()]);
		return out;
	}

	// The mouse held by the game (Input.MOUSE_MODE_CAPTURED). A browser locks the pointer only while it handles a click or a
	// key, and Godot asks once, when the game says so (a match starting: no click then), so the ask is kept here and made
	// again at the next click or key. Esc (the browser's own way out of a lock) drops it; the game's own click asks again.
	// A page that cannot lock at all (an ask made in a click refused: an embedded page such as the app's own browser, maybe
	// Reddit's frame) gets a stand-in: document.pointerLockElement answers the canvas while the game wants the mouse, so
	// Godot's Input.mouse_mode reads CAPTURED and the game runs as under a lock (every move's movementX/Y turns the camera,
	// clicks and the wheel are the game's), the cursor hidden over the game; window.tidebreakMouse.edge (-1 left, 1 right)
	// says it is held against an edge, where it stops (WebMouse.edge_turn keeps turning). The game letting go (a menu) ends it.
	const canvasEl = document.getElementById('canvas');
	const mouse = { stand_in: false, edge: 0 };
	window.tidebreakMouse = mouse;
	const lockNow = HTMLCanvasElement.prototype.requestPointerLock;
	const exitNow = Document.prototype.exitPointerLock;
	const lockedGet = Object.getOwnPropertyDescriptor(Document.prototype, 'pointerLockElement');
	let wantLock = false;     // the game wants the mouse held
	// an ask made in a click or key was refused: this page cannot lock (a touch screen never can: TouchControls plays there,
	// and ?touch=1 tries it at a desk)
	const touchFirst = matchMedia('(pointer: coarse)').matches || /[?&]touch=1/.test(location.search);
	let refused = touchFirst;
	let askedAt = -1e9;       // when the last ask made in a click or key went out
	let gameExit = false;
	function realLocked() {
		return lockedGet.get.call(document) === canvasEl;
	}
	function standIn() {
		mouse.stand_in = wantLock && refused;
		canvasEl.classList.toggle('free-look', mouse.stand_in);
		if (!mouse.stand_in) {
			mouse.edge = 0;
		}
	}
	// A refusal of ours counts only when it means this page cannot lock (2026-10-13: in Chrome the game's own ask could
	// meet ours on the same click and be turned down, and one refusal kept the stand-in for good: the mouse never locked
	// again): a SecurityError (an embedded page that may not lock), or a second refusal in a click while no lock has ever
	// held here. Godot's own ask outside a click is refused anywhere and never counts. A lock that holds clears it.
	let everLocked = false;
	let misses = 0;
	let pending = false;
	function onRefused(err) {
		pending = false;
		if (everLocked || performance.now() - askedAt >= 1500) {
			return;
		}
		misses += 1;
		if ((err && err.name === 'SecurityError') || misses >= 2) {
			refused = true;
			standIn();
		}
	}
	function lock() {
		if (pending) {
			return;                           // (one ask at a time: a second on the same click is turned down)
		}
		pending = true;
		setTimeout(function () {
			pending = false;
		}, 1000);
		try {
			const p = lockNow.call(canvasEl);
			if (p && p.catch) {
				p.catch(onRefused);
			}
		} catch (err) {
			onRefused(err);
		}
	}
	if (lockNow && exitNow && lockedGet && lockedGet.get) {
		Object.defineProperty(document, 'pointerLockElement', {
			configurable: true,
			get: function () {
				return mouse.stand_in ? canvasEl : lockedGet.get.call(document);
			},
		});
		document.addEventListener('pointerlockerror', function () {
			onRefused(null);
		});
		canvasEl.requestPointerLock = function () {
			wantLock = true;
			if (refused) {
				standIn();
				return;
			}
			lock();
		};
		document.exitPointerLock = function () {
			wantLock = false;
			standIn();
			if (realLocked()) {
				gameExit = true;
				exitNow.call(document);
			}
		};
		const again = function (e) {
			if (e.key === 'Escape' || !wantLock || refused || realLocked()) {
				return;
			}
			askedAt = performance.now();
			lock();
		};
		canvasEl.addEventListener('mousedown', again, true);
		document.addEventListener('keydown', again, true);
		document.addEventListener('pointerlockchange', function () {
			pending = false;
			if (realLocked()) {
				everLocked = true;
				misses = 0;
				refused = false;
			} else if (!gameExit) {
				wantLock = false;               // (Esc: the browser let go; the game's own click asks again)
			}
			gameExit = false;
			standIn();
		});
		// (a finger's moves are not the mouse's: Godot reads touches as touches, and its pointermove would turn the look
		// with the stick's thumb)
		window.addEventListener('pointermove', function (e) {
			if (e.pointerType === 'touch') {
				e.stopImmediatePropagation();
			}
		}, true);
		window.addEventListener('pointermove', function (e) {
			if (mouse.stand_in && e.pointerType === 'mouse') {
				const w = window.innerWidth;
				mouse.edge = e.clientX <= w * 0.03 ? -1 : (e.clientX >= w * 0.97 ? 1 : 0);
			}
		}, true);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs:\n' + missing.join('\n'));
		return;
	}

	engine.config.update({
		onProgress: function (current, max) {
			if (max > 0) {
				got.wasm = current;
				total.wasm = max;
				show();
			}
		},
	});
	Promise.all([engine.init(exe), loadParts()]).then(([, joined]) => {
		if (joined === null) {
			// Not split: the whole pack, the usual way (the engine's progress then counts it with the wasm).
			return engine.preloadFile(pack, pack);
		}
		// (its ArrayBuffer: preloadFile looks the file up in fileSizes by its argument, and a Uint8Array as a key is
		// turned into a string of every byte)
		return engine.preloadFile(joined.buffer, pack);
	}).then(() => {
		text.textContent = 'Starting';
		return engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG['args'] || []) });
	}).then(() => {
		status.remove();
	}, fail);
}());
		</script>
	</body>
</html>
